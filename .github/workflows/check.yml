name: Check for new procurement processes

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours -- change the "*/4" to adjust
  workflow_dispatch: {}  # lets you trigger a manual run from the GitHub website

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml

      - name: Run check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python check_run.py

      - name: Commit updated state
        run: |
          git config user.name "dr-tracker-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen processes"
          git push
