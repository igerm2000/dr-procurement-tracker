name: Procurement tracker (weekday business-hours check, one daily email)

on:
  schedule:
    # Mon-Fri, 8:00 AM - 6:30 PM Santo Domingo time (UTC-4, fixed, no DST)
    # = 12:00 - 22:30 UTC. Minutes offset to :07/:22/:37/:52 instead of
    # round numbers (:00/:15/:30/:45) -- those are the most congested
    # slots on GitHub since virtually every scheduled workflow targets
    # them, which is why most of our runs were getting dropped.
    - cron: '7,22,37,52 12-21 * * 1-5'   # ~8:00 AM - 5:52 PM local, every 15 min
    - cron: '7,22,37 22 * * 1-5'         # ~6:07, 6:22, 6:37 PM local
  workflow_dispatch: {}  # manual runs are unrestricted -- fine to test anytime

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml

      - name: Run tracker
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python daily_run.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "dr-tracker-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update tracker state"
          git push
